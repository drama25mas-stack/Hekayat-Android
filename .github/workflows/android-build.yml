name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build and run unit tests
        env:
          STORIES_API_BASE_URL: ${{ vars.STORIES_API_BASE_URL }}
        run: |
          API_BASE_URL="$STORIES_API_BASE_URL"
          if [ -z "$API_BASE_URL" ]; then API_BASE_URL="https://YOUR-WORKER.workers.dev/"; fi
          gradle --no-daemon -PSTORIES_API_BASE_URL="$API_BASE_URL" testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hekayat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
